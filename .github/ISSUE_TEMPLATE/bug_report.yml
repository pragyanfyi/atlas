name: Bug report
description: Something on the Atlas site is broken (layout, search, theming, links)
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what did you see instead?
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page URL
      placeholder: https://...
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: env
    attributes:
      label: Browser and OS
      placeholder: Safari 19 on iOS 27
